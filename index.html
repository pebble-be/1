<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Accueil</title><link rel=stylesheet href=style.css?v=2.6></head><body><main id=v></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="fb.js?v=2.6"></script><script src="app.js?v=2.6"></script><script>boot('index').then(async me=>{const v=$('#v');let L=[];const fol=new Set([me.uid]);(await db.collection(`users/${me.uid}/following`).get()).forEach(d=>fol.add(d.id));
let ST=[];const strip=()=>{const by={};ST.forEach(s=>(by[s.uid]=by[s.uid]||[]).push(s));const ids=Object.keys(by).filter(i=>i!=me.uid);return`<div class=strip><div data-s=add><div class=av style="width:62px;height:62px;margin:0 auto 4px;background:var(--bd);color:var(--tx)">${ic('plus')}</div>Story</div>${by[me.uid]?`<div data-s=${me.uid}>${av(me,62)}Ma story</div>`:''}${ids.map(i=>`<div data-s=${i}>${av(UC[i],62)}${esc(UC[i].username)}</div>`).join('')}</div>`};
function addStory(){storyEditor()}
function view(uid){viewStories(ST.filter(s=>s.uid==uid).reverse(),UC[uid],{own:uid==me.uid})}
db.collection('stories').orderBy('t','desc').limit(100).onSnapshot(async s=>{ST=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>fol.has(x.uid)&&!(me.blocked||[]).includes(x.uid)&&Date.now()-(x.t?x.t.toMillis():Date.now())<864e5);await Promise.all([...new Set(ST.map(x=>x.uid))].map(gu));draw()});
const draw=()=>{v.innerHTML='<h1>Accueil</h1>'+strip()+(L.map((p,i)=>{const a=UC[p.uid],lk=(p.likes||[]).includes(me.uid);return`<div class=card><div class=row><a href="profile.html?u=${a.username}" class=row style=text-decoration:none>${av(a,40)}<b>${esc(a.username)}</b></a><span class=sp></span><span class=mut>${ago(p.t)}</span></div><img src="${p.img}" loading=lazy decoding=async style="width:100%;border-radius:18px;margin:10px 0;display:block"><div class=acts><button data-a=l data-i=${i} class="${lk?'red':''}">${ic('heart',lk?'f':'')}</button><button data-a=o data-i=${i}>${ic('chat')}</button><button data-a=r data-i=${i} class="${(me.reposted||[]).includes(p.id)?'red':''}">${ic('repeat')}</button><button data-a=h data-i=${i}>${ic('send')}</button><span class=sp></span><button data-a=s data-i=${i}>${ic('bookmark',(me.saved||[]).includes(p.id)?'f':'')}</button></div><b>${(p.likes||[]).length} j'aime</b><p><b>${esc(a.username)}</b> ${esc(p.cap)}</p></div>`}).join('')||`<div class=card style=text-align:center><p class=mut>Ton fil est vide. Suis des comptes depuis Découvrir.</p><a class=btn href=discover.html style=margin-top:10px>Découvrir</a></div>`)};
v.onclick=async e=>{const s=e.target.closest('[data-s]');if(s)return s.dataset.s=='add'?addStory():view(s.dataset.s);const b=e.target.closest('[data-a]');if(!b)return;const p=L[+b.dataset.i],k=b.dataset.a;if(k=='o')return openPost(p);if(k=='h')return shareSheet(p);if(k=='r')await tog('reposted',p.id,p.uid);if(k=='s')await tog('saved',p.id,p.uid);if(k=='l'){const lk=(p.likes||[]).includes(me.uid);await db.doc('posts/'+p.id).update({likes:lk?FV.arrayRemove(me.uid):FV.arrayUnion(me.uid)});if(!lk)notify(p.uid,'like','a aimé votre publication')}draw()};
db.collection('posts').orderBy('t','desc').limit(100).onSnapshot(async s=>{L=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>fol.has(p.uid)&&!(me.blocked||[]).includes(p.uid));await Promise.all([...new Set(L.map(p=>p.uid))].map(gu));draw()})});</script></body></html>
