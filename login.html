<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Connexion</title><link rel=stylesheet href=style.css?v=2.7></head><body><main id=v></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="fb.js?v=2.7"></script><script src="app.js?v=2.7"></script><script>authPage('Bon retour','Connecte-toi pour retrouver ton monde.',fld('mail','em','Email','email')+fld('lock','pw','Mot de passe','password')+'<div class=err id=er></div><p class=mut style="text-align:right;margin:6px 0"><a href=# id=fg>Mot de passe oublié ?</a></p><button class=btn id=go style="width:100%;padding:13px">Se connecter</button>','Pas encore de compte ? <a href=signup.html><b>Créer un compte</b></a>');
auth.onAuthStateChanged(async u=>{if(u&&u.emailVerified&&(await db.doc('users/'+u.uid).get()).exists)location.href='discover.html'});
const E={'auth/invalid-credential':'Email ou mot de passe incorrect','auth/invalid-email':'Email invalide','auth/too-many-requests':'Trop de tentatives, réessaie plus tard'};
$('#go').onclick=()=>withLoad($('#go'),'Connexion en cours…',async()=>{$('#er').textContent='';try{const c=await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value);if(!c.user.emailVerified){try{await c.user.sendEmailVerification()}catch(_){}await auth.signOut();$('#er').textContent="Email pas encore vérifié. On t'a renvoyé un lien de confirmation : clique dessus puis reconnecte-toi."}}catch(x){$('#er').textContent=E[x.code]||x.message}});
$('#pw').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
$('#fg').onclick=async e=>{e.preventDefault();try{await auth.sendPasswordResetEmail($('#em').value.trim());$('#er').className='err ok';$('#er').textContent='Email de réinitialisation envoyé ✓'}catch(x){$('#er').textContent=E[x.code]||'Entre ton email d\'abord'}};</script></body></html>
