<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Notifications</title><link rel=stylesheet href=style.css?v=3.7></head><body><main id=v></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="fb.js?v=3.7"></script><script src="app.js?v=3.7"></script><script>boot('notifications').then(me=>{const v=$('#v'),M={like:'likes',comment:'comments',follow:'followers',message:'messages'},I={like:'heart',comment:'chat',follow:'person',message:'send',save:'bookmark',repost:'repeat',screenshot:'eye',call:'phone'};
db.collection(`users/${me.uid}/notifs`).orderBy('t','desc').limit(60).onSnapshot(async s=>{const L=s.docs.map(d=>({id:d.id,...d.data()})).filter(n=>n.type!='message'&&(me.notif||{})[M[n.type]]!==0&&!(me.blocked||[]).includes(n.from));
 v.innerHTML='<h1>Notifications</h1><div class=card>'+(L.map(n=>`<div class="item row" style="${n.seen?'':'background:var(--bd);border-radius:14px;padding:10px'}"><span class=ib>${ic(I[n.type]||'heart')}</span><a href="profile.html?u=${esc(n.fu)}" class=sp style=text-decoration:none><b>${esc(n.fu)}</b> ${esc(n.text)}<div class=mut>${ago(n.t)}</div></a></div>`).join('')||'<p class=mut>Rien de nouveau.</p>')+'</div>';
 const un=s.docs.filter(d=>!d.data().seen&&d.data().type!='message');if(un.length){const b=db.batch();un.forEach(d=>b.update(d.ref,{seen:true}));setTimeout(()=>b.commit(),1500)}})});</script></body></html>
