<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Inscription</title><link rel=stylesheet href=style.css?v=3.7></head><body><main id=v></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="fb.js?v=3.7"></script><script src="app.js?v=3.7"></script><script>authPage('Crée ton compte','Rejoins Pebble en quelques secondes.',fld('person','nm','Nom complet')+fld('at','un','Nom d\'utilisateur')+'<div class=err id=ue></div>'+fld('mail','em','Email','email')+fld('lock','pw','Mot de passe (6+ caractères)','password')+'<div class=err id=er></div><button class=btn id=go style="width:100%;padding:13px;margin-top:8px">Créer mon compte</button>','Déjà un compte ? <a href=login.html><b>Se connecter</b></a>');
const ok=u=>/^[a-z0-9._]{3,20}$/.test(u),E={'auth/email-already-in-use':'Cet email est déjà utilisé','auth/weak-password':'Mot de passe : 6 caractères minimum','auth/invalid-email':'Email invalide','permission-denied':'Accès refusé par Firestore : publie les règles du README','unavailable':'Firestore injoignable : crée la base Firestore Database'};
$('#un').oninput=async()=>{const u=$('#un').value.trim().toLowerCase(),e=$('#ue');e.className='err';if(!ok(u))return e.textContent='3-20 caractères : a-z, 0-9, . _';const d=await db.doc('usernames/'+u).get();e.textContent=d.exists?'Déjà pris':'Disponible ✓';if(!d.exists)e.className='err ok'};
$('#go').onclick=()=>withLoad($('#go'),'Création du compte…',async()=>{const e=$('#er'),u=$('#un').value.trim().toLowerCase(),n=$('#nm').value.trim()||u,em=$('#em').value.trim();e.textContent='';try{
 if(!ok(u))throw{message:"Nom d'utilisateur invalide"};if((await db.doc('usernames/'+u).get()).exists)throw{message:"Nom d'utilisateur déjà pris"};
 const c=await auth.createUserWithEmailAndPassword(em,$('#pw').value);
 try{await db.runTransaction(async t=>{const r=db.doc('usernames/'+u);if((await t.get(r)).exists)throw Error("Nom d'utilisateur déjà pris");t.set(r,{uid:c.user.uid});t.set(db.doc('users/'+c.user.uid),{name:n,username:u,email:em,bio:'',notif:{likes:1,comments:1,followers:1,messages:1},created:TS()})})}catch(x){await c.user.delete();throw x}
 await c.user.sendEmailVerification();await auth.signOut();document.querySelector('.box').innerHTML='<h2 style="font-size:30px">Vérifie ton email</h2><p class=mut style="margin:12px 0">On a envoyé un lien de confirmation à <b>'+esc(em)+'</b>. Clique dessus (regarde aussi les spams), puis connecte-toi.</p><a class=btn href=login.html style="display:block;text-align:center">Aller à la connexion</a>'}catch(x){e.textContent=E[x.code]||(x.code=='permission-denied'?E['permission-denied']:x.message)}});</script></body></html>
