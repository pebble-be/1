<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Découvrir</title><link rel=stylesheet href=style.css?v=2.6></head><body><main id=v></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="fb.js?v=2.6"></script><script src="app.js?v=2.6"></script><script>boot('discover').then(me=>{const v=$('#v');let P=[],fol=new Set();
v.innerHTML=`<div class=row><div class=sp style=position:relative><div class=fi style=margin:0>${ic('search')}<input class=in id=q placeholder="Rechercher un compte"></div><div class=card id=sr style="display:none;position:absolute;left:0;right:0;top:52px;z-index:4;margin:0"></div></div><button class=btn id=add style="padding:11px 14px">${ic('plus')}</button></div><input type=file accept=image/* id=fi hidden><div class=ex id=ex style=margin-top:14px></div>`;
db.collection(`users/${me.uid}/following`).onSnapshot(s=>fol=new Set(s.docs.map(d=>d.id)));
db.collection('posts').orderBy('t','desc').limit(60).onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>!(me.blocked||[]).includes(p.uid));$('#ex').innerHTML=P.length?P.map((p,i)=>`<div class="${i%10==2?'big':''}" data-i=${i}><img src="${p.img}" loading=lazy><span>${(p.likes||[]).length} j'aime</span></div>`).join(''):'<p class=mut style="grid-column:1/-1;text-align:center;padding:40px">Aucune publication pour le moment. Sois le premier !</p>'});
$('#ex').onclick=e=>{const t=e.target.closest('[data-i]');if(t)openPost(P[+t.dataset.i])};$('#add').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;const img=await compress(f),o=sheet(`<b>Nouvelle publication</b><img src="${img}" style="width:100%;border-radius:16px;margin:10px 0"><input class=in id=cp placeholder="Légende…"><div class=err id=er></div><button class=btn id=pb style=margin-top:10px>Publier</button>`);$('#pb').onclick=()=>withLoad($('#pb'),'Publication…',async()=>{const url=await up(img);await db.collection('posts').add({uid:me.uid,username:me.username,img:url,cap:$('#cp').value,likes:[],t:TS()});o.remove()},6e4)};
let tm;$('#q').oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{const q=$('#q').value.trim().toLowerCase().replace('@',''),r=$('#sr');if(!q)return r.style.display='none';const s=await db.collection('users').where('username','>=',q).where('username','<=',q+'\uf8ff').limit(8).get();r.style.display='block';
 r.innerHTML=s.docs.filter(d=>d.id!=me.uid&&!(me.blocked||[]).includes(d.id)).map(d=>{const x={uid:d.id,...d.data()};return`<div class="item row"><a href="profile.html?u=${x.username}">${av(x,40)}</a><a class=sp href="profile.html?u=${x.username}" style=text-decoration:none><b>${esc(x.username)}</b><div class=mut>${esc(x.name)}</div></a><button class="btn ${fol.has(x.uid)?'g':''}" data-f=${x.uid}>${fol.has(x.uid)?'Suivi':'Suivre'}</button></div>`}).join('')||'<p class=mut>Aucun compte trouvé</p>'},300)};
$('#sr').onclick=async e=>{const id=e.target.dataset.f;if(!id)return;const on=await follow(id);e.target.textContent=on?'Suivi':'Suivre';e.target.className='btn '+(on?'g':'')}});</script></body></html>
