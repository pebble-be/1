<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Paramètres</title><link rel=stylesheet href=style.css?v=3.1></head><body><main id=v></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="fb.js?v=3.1"></script><script src="app.js?v=3.1"></script><script>boot('settings').then(me=>{const v=$('#v'),m=me,tg=(k,l)=>`<div class="item row"><span class=sp>${l}</span><input type=checkbox class=tg data-n=${k} ${(m.notif||{})[k]!==0?'checked':''}></div>`;
v.innerHTML=`<h1>Paramètres</h1><div class=card><b>Profil</b><div class=row style=margin:10px 0>${av(m,64)}<button class="btn g" id=ph>Changer la photo</button></div><input type=file accept=image/* id=pf hidden><label>Nom</label><input class=in id=sn value="${esc(m.name)}"><label>Nom d'utilisateur (unique)</label><input class=in id=su value="${esc(m.username)}"><label>Bio</label><textarea class=in id=sb rows=4 maxlength=200 placeholder="Écris ta bio… (Entrée = nouvelle ligne)">${esc(m.bio)}</textarea><div class=mut id=bc style="text-align:right;margin-top:2px"></div><div class=err id=pe></div><button class=btn id=sp style=margin-top:10px>Enregistrer</button></div>
<div class=card><b>Compte</b><label>Mot de passe actuel (requis pour changer email / mot de passe)</label><input class=in id=cur type=password><label>Email</label><input class=in id=em value="${esc(auth.currentUser.email)}"><label>Téléphone</label><input class=in id=tel value="${esc(m.phone||'')}"><label>Nouveau mot de passe</label><input class=in id=pw type=password><div class=err id=ae></div><button class=btn id=sa style=margin-top:10px>Mettre à jour</button></div>
<div class=card><b>Notifications</b><div class="item row"><span class=sp>Alertes sur cet appareil</span></div><div id=ns style="margin:2px 0 10px"></div>${tg('likes',"J'aime")}${tg('comments','Commentaires')}${tg('followers','Nouveaux abonnés')}${tg('messages','Messages')}</div><div class=card><b>Comptes bloqués</b><div id=bl></div></div><button class="btn r" id=lo style=width:100%>Se déconnecter</button>`;
const cc=()=>$('#bc').textContent=$('#sb').value.length+'/200';$('#sb').oninput=cc;cc();let photo;$('#ph').onclick=()=>$('#pf').click();$('#pf').onchange=async e=>{try{$('#ph').textContent='Envoi…';photo=await up(await compress(e.target.files[0],300));$('#ph').textContent='Photo prête ✓'}catch(x){$('#ph').textContent='Changer la photo';$('#pe').textContent=x.message}};
const bl=async()=>{const u=await Promise.all((m.blocked||[]).map(gu));$('#bl').innerHTML=u.map(x=>`<div class="item row">${av(x,38)}<b class=sp>${esc(x.username)}</b><button class="btn g" data-u=${x.uid}>Débloquer</button></div>`).join('')||'<p class=mut>Aucun compte bloqué.</p>'};bl();
const nr=()=>{const p='Notification' in window?Notification.permission:'unsupported',e=$('#ns');e.innerHTML=p=='granted'?'<span style="color:#34c759;font-weight:600">✓ Activées sur cet appareil</span>':p=='default'?'<button class="btn g" id=na>Activer les alertes</button>':p=='denied'?'<span class=mut>Les alertes sont bloquées par ton navigateur. Clique sur le cadenas à côté de l\'adresse → Notifications → Autoriser, puis recharge la page.</span>':'<span class=mut>Les alertes ne sont pas disponibles ici. Sur iPhone : Partager → « Sur l\'écran d\'accueil », puis ouvre Pebble depuis l\'icône.</span>';const b=$('#na');if(b)b.onclick=async()=>{try{await Notification.requestPermission()}catch(x){}nr();initPush()}};nr();
try{navigator.permissions.query({name:'notifications'}).then(p=>p.onchange=nr)}catch(x){}
$('#sp').onclick=async()=>{const e=$('#pe'),u=$('#su').value.trim().toLowerCase();e.className='err';try{if(!/^[a-z0-9._]{3,20}$/.test(u))throw Error('3-20 caractères : a-z, 0-9, . _');const d={name:$('#sn').value.trim()||u,bio:$('#sb').value.replace(/\r/g,'').split('\n').slice(0,6).join('\n').trim(),username:u,...(photo?{photo}:{})};
 if(u!=m.username)await db.runTransaction(async t=>{const r=db.doc('usernames/'+u);if((await t.get(r)).exists)throw Error("❌ Ce nom d'utilisateur est déjà pris");t.set(r,{uid:m.uid});t.delete(db.doc('usernames/'+m.username));t.update(db.doc('users/'+m.uid),d)});else await db.doc('users/'+m.uid).update(d);
 Object.assign(m,d);e.className='err ok';e.textContent='Profil enregistré ✓'}catch(x){e.textContent=x.message}};
$('#sa').onclick=async()=>{const e=$('#ae'),U=auth.currentUser;e.className='err';try{await db.doc('users/'+m.uid).update({phone:$('#tel').value});const em=$('#em').value.trim(),pw=$('#pw').value;if(em!=U.email||pw){await U.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(U.email,$('#cur').value));if(pw)await U.updatePassword(pw);if(em!=U.email)await U.verifyBeforeUpdateEmail(em)}e.className='err ok';e.textContent='Mis à jour ✓ (si tu changes l\'email, confirme-le par mail)'}catch(x){e.textContent=x.code=='auth/invalid-credential'||x.code=='auth/wrong-password'?'Mot de passe actuel incorrect':x.message}};
v.onclick=async e=>{const n=e.target.dataset.n,u=e.target.dataset.u;if(n){m.notif={...(m.notif||{}),[n]:e.target.checked?1:0};await db.doc('users/'+m.uid).update({notif:m.notif})}if(u){await db.doc('users/'+m.uid).update({blocked:FV.arrayRemove(u)});m.blocked=m.blocked.filter(x=>x!=u);bl()}};
$('#lo').onclick=async()=>{try{if(localStorage.pbtk)await db.doc(`users/${m.uid}/tokens/${localStorage.pbtk}`).delete()}catch(x){}auth.signOut()}});</script></body></html>
