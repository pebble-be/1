<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Profil</title><link rel=stylesheet href=style.css?v=2.2></head><body><main id=v></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="fb.js?v=2.2"></script><script src="app.js?v=2.2"></script><script>boot('profile').then(async me=>{const v=$('#v'),un=new URLSearchParams(location.search).get('u'),x=un&&un!=me.username?await byName(un):me;if(!x)return v.innerHTML='<div class=card>Compte introuvable.</div>';const own=x.uid==me.uid;
const[ps,fg,fr,mf]=await Promise.all([db.collection('posts').where('uid','==',x.uid).get(),db.collection(`users/${x.uid}/following`).get(),db.collection(`users/${x.uid}/followers`).get(),db.collection(`users/${me.uid}/following`).get()]);
const mine=new Set(mf.docs.map(d=>d.id)),posts=ps.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.t?.seconds||0)-(a.t?.seconds||0)),mu=await Promise.all(fr.docs.filter(d=>mine.has(d.id)&&d.id!=me.uid).slice(0,3).map(d=>gu(d.id)));let isF=mine.has(x.uid),tab='p',hl=hlNorm(x.highlights);
const ids=async a=>(await Promise.all((a||[]).map(i=>db.doc('posts/'+i).get()))).filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
const draw=async()=>{hl=hlNorm(x.highlights);const L=tab=='p'?posts:await ids(tab=='s'?me.saved:x.reposted);window.L=L;
v.innerHTML=`<div class=card><div class=pf>${av(x,92)}<div class=sp><h1 style=margin:0>${esc(x.name)} ${x.verified?ic('check','red'):''}</h1><div class=mut>@${esc(x.username)}</div><div class=stats><div><b>${posts.length}</b>publications</div><div><b>${fr.size}</b>abonnés</div><div><b>${fg.size}</b>suivis</div></div></div></div>${x.bio?`<p style="margin-top:10px;white-space:pre-line;word-break:break-word">${esc(x.bio)}</p>`:''}${!own&&mu.length?`<p class=mut style="margin:8px 0">Suivi par ${mu.map(u=>esc(u.username)).join(', ')}</p>`:''}
<div class=row style=margin-top:12px>${own?'<a class=btn href=settings.html>Modifier le profil</a>':`<button class="btn ${isF?'g':''}" id=fo>${isF?'Suivi':'Suivre'}</button><a class="btn g" href="messages.html?u=${x.username}">Message</a>`}</div>
<div class=strip style=margin-top:16px>${hl.map((h,i)=>`<div class=hl data-h=${i}><div class=av style="width:62px;height:62px;margin:0 auto 4px;background:url(${h.cover}) center/cover"></div>${esc(h.title)}</div>`).join('')}${own?`<div class=hl id=ah><div class=av style="width:62px;height:62px;margin:0 auto 4px;background:var(--bd);color:var(--tx)">${ic('plus')}</div>Nouveau</div>`:''}</div>
<div class=tabs>${[['p','Publications'],['r','Reposts'],...(own?[['s','Enregistrés']]:[])].map(t=>`<button data-t=${t[0]} class="${tab==t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div class=grid>${L.map((p,i)=>`<div data-i=${i} style="background:url(${p.img}) center/cover;cursor:pointer"></div>`).join('')||'<p class=mut style="grid-column:1/-1;text-align:center;padding:20px">Rien ici</p>'}</div></div>`;
const f=$('#fo');if(f)f.onclick=async()=>{isF=await follow(x.uid);draw()};
const ah=$('#ah');if(ah)ah.onclick=()=>newHL(()=>draw())};
v.onclick=e=>{const t=e.target.closest('[data-t]'),i=e.target.closest('[data-i]'),h=e.target.closest('[data-h]');if(t){tab=t.dataset.t;draw()}else if(i)openPost(window.L[+i.dataset.i]);else if(h){const H=hl[+h.dataset.h];viewStories(H.items.map(q=>({...q})),x,{own,hl:H,onChange:()=>draw()})}};draw()});</script></body></html>
