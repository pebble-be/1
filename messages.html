<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Messages</title><link rel=stylesheet href=style.css></head><body><main id=v></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="fb.js"></script><script src="app.js"></script><script>boot('messages').then(async me=>{const v=$('#v'),cid=o=>[me.uid,o].sort().join('_'),sp=m=>({img:'Photo',voice:'Message vocal',sticker:m.v})[m.t]||m.v;let un=[];const stop=()=>{un.forEach(f=>f());un=[]};
async function list(){stop();history.replaceState(0,'','messages.html');const fs=await db.collection(`users/${me.uid}/following`).get(),F=await Promise.all(fs.docs.map(d=>gu(d.id))),now=Date.now(),NT=[me,...F].filter(u=>u.note&&now-u.note.t<864e5);
 v.innerHTML=`<div class=row><h1 class=sp>Messages</h1><button class=btn id=nw>${ic('plus')}</button></div><div class=strip><div id=nn>${av(me,56)}<span class=mut>Ma note</span></div>${NT.map(u=>`<div style=width:96px><div class=mut style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:5px;margin-bottom:4px">${esc(u.note.text)}</div>${av(u,48)}</div>`).join('')}</div><div class=card id=cl></div>`;
 $('#nn').onclick=()=>{const o=sheet('<b>Nouvelle note</b><input class=in id=nt placeholder="Texte ou 🎵 musique…" style="margin:10px 0"><button class=btn id=ns>Partager</button>');$('#ns').onclick=async()=>{const t=$('#nt').value.trim();if(t){const n={text:t,t:Date.now()};await db.doc('users/'+me.uid).update({note:n});me.note=n;o.remove();list()}}};
 $('#nw').onclick=()=>{const o=sheet('<b>Nouveau message</b>'+(F.map(u=>`<div class="item row" data-o=${u.uid} style=cursor:pointer>${av(u,40)}<b>${esc(u.username)}</b></div>`).join('')||'<p class=mut>Suis des comptes pour leur écrire.</p>'));o.onclick=e=>{const d=e.target.closest('[data-o]');if(d){o.remove();chat(d.dataset.o)}else if(e.target==o)o.remove()}};
 un.push(db.collection('chats').where('members','array-contains',me.uid).onSnapshot(async s=>{const C=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.t?.seconds||9e9)-(a.t?.seconds||9e9)),us=await Promise.all(C.map(c=>gu(c.members.find(i=>i!=me.uid))));
  $('#cl').innerHTML=C.map((c,i)=>(me.blocked||[]).includes(us[i].uid)?'':`<div class="item row" data-c=${us[i].uid} style=cursor:pointer>${av(us[i])}<div class=sp><b>${esc(us[i].username)}</b><div class=mut>${esc(c.last||'')}</div></div><span class=mut>${ago(c.t)}</span></div>`).join('')||'<p class=mut>Aucune discussion. Appuie sur + pour écrire.</p>'}));
 v.onclick=e=>{const c=e.target.closest('[data-c]');if(c)chat(c.dataset.c)}}
async function chat(oid){stop();const o=await gu(oid),id=cid(oid);let once=0,mr,ch=[],tm,sec=0;history.replaceState(0,'','messages.html?u='+o.username);
 v.innerHTML=`<div class=chat><div class="row card" style="margin-bottom:6px;padding:8px 12px"><button id=bk>${ic('back')}</button><a href="profile.html?u=${o.username}">${av(o,40)}</a><b class=sp>${esc(o.username)}</b><button id=st>${ic('dots')}</button></div><div class=msgs id=ms></div><div class=comp><button id=em>${ic('smile')}</button><button id=sk>${ic('sticker')}</button><button id=im>${ic('photo')}</button><button id=on>${ic('once')}</button><input class=in id=tx placeholder="Message…"><button id=mc>${ic('mic')}</button><button id=sd>${ic('send')}</button></div><input type=file accept=image/* id=fi hidden></div>`;
 let M=[];const draw=()=>{const b=$('#ms');b.innerHTML=M.map((m,i)=>{const c='b'+(m.from==me.uid?' me':'');
  if(m.t=='sticker')return`<div class="${c} big">${m.v}</div>`;
  if(m.once)return`<div class="${c} once" data-o=${i}>${m.seen?'Ouvert':(m.from==me.uid?'Vue unique · envoyé':'Appuie pour ouvrir (vue unique)')}</div>`;
  if(m.t=='img')return`<div class="${c}"><img src="${m.v}"></div>`;if(m.t=='voice')return`<div class="${c}"><audio controls src="${m.v}" style="max-width:220px"></audio></div>`;return`<div class="${c}">${esc(m.v)}</div>`}).join('')||'<p class=mut style=text-align:center;margin-top:30px>Commence la discussion</p>';b.scrollTop=1e9};
 un.push(db.collection(`chats/${id}/messages`).orderBy('t').onSnapshot(s=>{M=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
 const send=async m=>{const x=await gu(oid);await db.doc('users/'+oid).get().then(d=>UC[oid]={uid:oid,...d.data()});if((UC[oid].blocked||[]).includes(me.uid))return sheet("<b>Impossible d'envoyer</b><p class=mut>Ce compte ne peut pas recevoir tes messages.</p>");
  await db.doc('chats/'+id).set({members:[me.uid,oid],last:sp(m),t:TS()},{merge:true});await db.collection(`chats/${id}/messages`).add({from:me.uid,...m,once:!!(once&&m.t!='sticker'),seen:false,t:TS()});once=0;$('#on').style.color='';notify(oid,'message','vous a envoyé un message')};
 const go=()=>{const t=$('#tx').value.trim();if(t){$('#tx').value='';send({t:'t',v:t})}};$('#sd').onclick=go;$('#tx').onkeydown=e=>{if(e.key=='Enter')go()};$('#bk').onclick=list;
 $('#em').onclick=()=>{const s=sheet('<b>Emojis</b><div style="font-size:30px;margin-top:8px;line-height:1.6">'+[...'😀😂😍🥰😎🤩😭🙏👍🔥💛🎉😜🤔😴🥳'].map(e=>`<span data-e=${e} style=cursor:pointer>${e}</span>`).join('')+'</div>');s.onclick=e=>{if(e.target.dataset.e)$('#tx').value+=e.target.dataset.e;if(e.target==s||e.target.dataset.e)s.remove()}};
 $('#sk').onclick=()=>{const s=sheet('<b>Stickers</b><div style="font-size:56px;margin-top:8px">'+['🐱','🦄','🍕','🚀','💃','🥳'].map(e=>`<span data-s=${e} style=cursor:pointer>${e}</span>`).join('')+'</div>');s.onclick=e=>{if(e.target.dataset.s){send({t:'sticker',v:e.target.dataset.s});s.remove()}else if(e.target==s)s.remove()}};
 $('#im').onclick=()=>$('#fi').click();$('#fi').onchange=async e=>{if(e.target.files[0])try{await send({t:'img',v:await up(await compress(e.target.files[0],720))})}catch(x){sheet('<b>Envoi impossible</b><p class=mut>'+esc(x.message)+'</p>')}};
 $('#on').onclick=()=>{once^=1;$('#on').style.color=once?'var(--y)':''};
 $('#mc').onclick=async()=>{if(mr&&mr.state=='recording')return mr.stop();try{const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);ch=[];sec=0;mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{clearInterval(tm);st.getTracks().forEach(t=>t.stop());$('#mc').classList.remove('rec');$('#tx').placeholder='Message…';const f=new FileReader();f.onload=async()=>{try{await send({t:'voice',v:await up(f.result),d:sec})}catch(x){sheet('<b>Envoi impossible</b><p class=mut>'+esc(x.message)+'</p>')}};f.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};mr.start();$('#mc').classList.add('rec');tm=setInterval(()=>{sec++;$('#tx').placeholder='● '+sec+'s — appuie pour envoyer';if(sec>=45)mr.stop()},1000)}catch(x){sheet('<b>Micro refusé</b><p class=mut>Autorise le micro dans ton navigateur.</p>')}};
 $('#ms').onclick=async e=>{const m=M[e.target.dataset.o];if(!m||m.seen||m.from==me.uid)return;await db.doc(`chats/${id}/messages/${m.id}`).update({seen:true});const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div>${m.t=='img'?`<img src="${m.v}" style="max-width:90vw;max-height:70vh;border-radius:16px">`:m.t=='voice'?`<audio controls autoplay src="${m.v}"></audio>`:`<p style=font-size:24px>${esc(m.v)}</p>`}<p style=margin:12px>Vue unique : disparaît après fermeture</p><button class=btn>Fermer</button></div>`;ov.querySelector('button').onclick=()=>ov.remove();document.body.append(ov)};
 $('#st').onclick=()=>{const s=sheet(`<b>Paramètres de la discussion</b><button class="btn g" id=x1>${ic('ban')} Bloquer ${esc(o.username)}</button><button class="btn g" id=x2>${ic('flag')} Signaler</button><button class="btn r" id=x3>${ic('trash')} Supprimer la discussion</button>`);
  $('#x1').onclick=async()=>{await db.doc('users/'+me.uid).update({blocked:FV.arrayUnion(oid)});me.blocked=[...(me.blocked||[]),oid];s.remove();list()};
  $('#x3').onclick=async()=>{const q=await db.collection(`chats/${id}/messages`).get(),b=db.batch();q.forEach(d=>b.delete(d.ref));b.delete(db.doc('chats/'+id));await b.commit();s.remove();list()};
  $('#x2').onclick=()=>{s.remove();const r=sheet('<b>Signaler '+esc(o.username)+'</b>'+['Spam','Harcèlement','Contenu inapproprié','Faux compte'].map(t=>`<button class="btn g">${t}</button>`).join(''));r.onclick=async e=>{if(e.target.tagName=='BUTTON'){await db.collection('reports').add({by:me.uid,target:oid,reason:e.target.textContent,t:TS()});r.firstChild.innerHTML='<b>Merci</b><p class=mut>Signalement envoyé.</p>';setTimeout(()=>r.remove(),1200)}}}}}
const q=new URLSearchParams(location.search).get('u');if(q){const o=await byName(q);o?chat(o.uid):list()}else list()});</script></body></html>
